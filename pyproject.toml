[project]
name = "legallens-api"
version = "0.1.0"
description = "LegalLens - AI Legal Document Risk & Action Navigator"
requires-python = ">=3.11"
readme = "README.md"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "ANN",  # flake8-annotations
    "S",    # flake8-bandit
    "RUF",  # ruff-specific
]
ignore = [
    "ANN401",  # dynamically typed expressions (Any)
    "S101",    # use of assert (allowed in tests)
    "E501",    # line length (handled by ruff format)
    "ANN201",  # missing return type for public functions
    "ANN202",  # missing return type for private functions
    "ANN001",  # missing type annotation for function arguments
    "ANN002",  # missing *args
    "ANN003",  # missing **kwargs
    "S104",    # possible binding to 0.0.0.0
    "B008",    # FastAPI Depends() in function parameters
    "S105",    # Hardcoded dev credentials in config defaults
    "E402",    # Module level import not at top of file (sys encoding init)
    "S110",    # try-except-pass blocks
    "B006",    # mutable default arguments
]

[tool.ruff.lint.isort]
known-first-party = ["app", "packages"]

[tool.pytest.ini_options]
testpaths = ["tests", "apps/api/tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "security: Security tests",
    "slow: Slow tests",
]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingImports = true
reportMissingTypeStubs = false

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
