name: LegalLens CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-eval:
    name: Backend Tests & Golden Evaluation
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r apps/api/requirements.txt
        pip install pytest pytest-asyncio pytest-cov httpx
        
    - name: Run Pytest Suite with Coverage
      env:
        PYTHONPATH: "apps/api:."
      run: |
        pytest tests/ -v --cov=app --cov=tests/eval_metrics
        
    - name: Run Golden Dataset Evaluation Benchmark
      env:
        PYTHONPATH: "apps/api:."
      run: |
        python scripts/run_evaluation.py

  frontend-quality-a11y:
    name: Frontend Lint, Tests & Production Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Node.js 20
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: apps/web/package-lock.json
        
    - name: Install UI dependencies
      working-directory: ./apps/web
      run: npm ci --legacy-peer-deps
      
    - name: Run Linter
      working-directory: ./apps/web
      run: npm run lint
      
    - name: Run Web & Accessibility Unit Tests
      working-directory: ./apps/web
      run: npm test
      
    - name: Verify Production Build
      working-directory: ./apps/web
      run: npm run build
